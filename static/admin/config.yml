  - name: assets
    label: Assets
    folder: docs/assets
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - label: Titulo
        name: title
        widget: string
      - label: Last Reviewed
        name: last_reviewed
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - label: Status
        name: status
        widget: hidden
        default: draft
      - label: Archivo
        name: file
        widget: image
      - label: Descripcion
        name: body
        widget: markdown

  - name: site_config
    label: Configuracion del sitio
    delete: false
    files:
      - name: homepage
        label: Home principal
        file: static/data/homepage.json
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - label: Eyebrow
                name: eyebrow
                widget: string
              - label: Titulo
                name: title
                widget: string
              - label: Subtitulo
                name: subtitle
                widget: text
              - label: Imagen fondo (URL oficial SOLE)
                name: background_image
                widget: string
              - label: CTA principal
                name: primary_cta
                widget: object
                fields:
                  - label: Texto
                    name: label
                    widget: string
                  - label: URL
                    name: href
                    widget: string
                  - label: Enlace externo
                    name: external
                    widget: boolean
                    default: false
              - label: CTA secundario
                name: secondary_cta
                widget: object
                fields:
                  - label: Texto
                    name: label
                    widget: string
                  - label: URL
                    name: href
                    widget: string
                  - label: Enlace externo
                    name: external
                    widget: boolean
                    default: false
          - label: Marca
            name: brand
            widget: object
            fields:
              - label: Logo (URL oficial SOLE)
                name: logo_url
                widget: string
              - label: Texto alternativo del logo
                name: logo_alt
                widget: string
          - label: Roles
            name: roles
            widget: list
            summary: '{{fields.label}}'
            fields:
              - label: ID de rol
                name: role_id
                widget: string
              - label: Etiqueta
                name: label
                widget: string
              - label: Persona responsable
                name: person
                widget: string
              - label: Descripcion
                name: description
                widget: text
              - label: Ruta inicial
                name: start_path
                widget: string
              - label: Links rapidos
                name: quick_links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - label: Texto
                    name: label
                    widget: string
                  - label: URL
                    name: href
                    widget: string
                  - label: Enlace externo
                    name: external
                    widget: boolean
                    default: false
          - label: Accesos rapidos de fundacion
            name: quick_access
            widget: list
            summary: '{{fields.label}}'
            fields:
              - label: Texto
                name: label
                widget: string
              - label: URL
                name: href
                widget: string
              - label: Enlace externo
                name: external
                widget: boolean
                default: true
