backend:
  name: github
  repo: SOLE-Colombia/sole-manuales
  branch: main
  # Auth via Cloudflare Worker (multi-usuario):
  base_url: https://auth.manual.solecolombia.org
  auth_endpoint: /auth/v2

publish_mode: editorial_workflow

site_url: https://intranet.solecolombia.org
display_url: https://intranet.solecolombia.org
logo_url: https://cdn.prod.website-files.com/6050c5e23e5cf1cbe505d4b5/655e8776ea625d500a2e14d7_Recurso%20220.svg

media_folder: static/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: cuentera-storyteller
    label: "Cuentera / Storyteller"
    folder: docs/cuentera-storyteller
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} · {{status}}'
    fields:
      - label: Titulo
        name: title
        widget: string
      - label: Sidebar Position
        name: sidebar_position
        widget: number
        value_type: int
        min: 1
      - label: Last Reviewed
        name: last_reviewed
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
      - label: Status
        name: status
        widget: select
        options:
          - draft
          - review
          - published
      - label: Contenido
        name: body
        widget: markdown

