name = "sole-manuales-auth-test"
main = "src/index.js"
compatibility_date = "2026-02-25"
workers_dev = true

# Este archivo es para pruebas.
# No usa custom domain; Cloudflare lo publica en *.workers.dev.

[vars]
# Permite usar login desde local y desde el dominio real del CMS.
ALLOWED_ORIGINS = "http://localhost:3000,https://manual.solecolombia.org"

# Usuario de prueba para el formulario.
CMS_LOGIN_USER = "editor-test"

# Secretos requeridos (setear con --config wrangler.test.toml):
# npx wrangler secret put CMS_LOGIN_PASSWORD --config wrangler.test.toml
# npx wrangler secret put CMS_GITHUB_TOKEN --config wrangler.test.toml
