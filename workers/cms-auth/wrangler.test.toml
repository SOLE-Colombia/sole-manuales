name = "sole-manuales-auth-test"
main = "src/index.js"
compatibility_date = "2026-02-25"
workers_dev = true

# Este archivo es para pruebas.
# No usa custom domain; Cloudflare lo publica en *.workers.dev.

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,https://manual.solecolombia.org,https://intranet.solecolombia.org"

# Secretos de prueba (setear con --config wrangler.test.toml):
#   npx wrangler secret put CMS_USERS --config wrangler.test.toml
#   npx wrangler secret put CMS_GITHUB_TOKEN --config wrangler.test.toml
#
# Formato CMS_USERS: JSON array, p.ej:
#   [{"user":"test@solecolombia.org","password":"test123","name":"Test User","role":"Editor"}]
