name = "sole-manuales-auth"
main = "src/index.js"
compatibility_date = "2026-02-25"
workers_dev = false

# Configura la ruta custom domain en Cloudflare Dashboard para:
# auth.manual.solecolombia.org

[vars]
# Lista separada por comas.
ALLOWED_ORIGINS = "https://manual.solecolombia.org,http://localhost:3000"

# Usuario de acceso al CMS (secreto recomendado si prefieres no versionarlo).
CMS_LOGIN_USER = "editor"

# Secretos requeridos (no se guardan en git):
# wrangler secret put CMS_LOGIN_PASSWORD
# wrangler secret put CMS_GITHUB_TOKEN
